name: Sites compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Build and exercise the Sites worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check migration history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --exit-code --no-renames --diff-filter=MDT "$BASE_SHA" HEAD -- 'drizzle/*.sql' || {
              echo 'Append a new SQL migration to upgrade databases that already ran the original.'
              exit 1
            }
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Select the managed Linux Sites profile
        run: |
          mkdir -p .sites-runtime
          echo '{"executionProfile":"managed-linux"}' > .sites-runtime/execution-profile.json
      - run: npm run install:ci
      - run: npm run verify:sites
